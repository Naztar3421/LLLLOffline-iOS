name: Build iOS localhost POC

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select an installed Xcode
        run: |
          set -e
          XCODE_APP="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Build arm64 iOS dylib
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build

          clang \
            -fblocks \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -I Sources/ApiHookPOC \
            Sources/ApiHookPOC/Entry.m \
            Sources/ApiHookPOC/LocalHTTPServer.m \
            Sources/ApiHookPOC/fishhook.c \
            -framework Foundation \
            -framework UIKit \
            -o build/LocalHTTPPOC.dylib

          xcrun otool -hv build/LocalHTTPPOC.dylib
          xcrun otool -L build/LocalHTTPPOC.dylib
          file build/LocalHTTPPOC.dylib

      - name: Build transparent local API proxy
        run: |
          set -euo pipefail
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"

          clang \
            -fblocks \
            -arch arm64 \
            -isysroot "$SDKROOT" \
            -miphoneos-version-min=15.0 \
            -dynamiclib \
            -I Sources/ApiLocalProxy \
            Sources/ApiLocalProxy/Entry.m \
            Sources/ApiLocalProxy/ApiLocalProxy.m \
            Sources/ApiHookPOC/fishhook.c \
            -framework Foundation \
            -framework UIKit \
            -o build/ApiLocalProxy.dylib

          xcrun otool -hv build/ApiLocalProxy.dylib
          xcrun otool -L build/ApiLocalProxy.dylib
          file build/ApiLocalProxy.dylib

      - name: Upload observer dylib
        uses: actions/upload-artifact@v4
        with:
          name: LocalHTTPPOC-dylib
          path: build/LocalHTTPPOC.dylib

      - name: Upload API local proxy dylib
        uses: actions/upload-artifact@v4
        with:
          name: ApiLocalProxy-dylib
          path: build/ApiLocalProxy.dylib
